services:
  # Render Web Service Configuration (Node.js Production Server)
  - type: web
    name: noorwallart-admin
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0

  # Render Static Site Configuration (Alternative SPA Build)
  - type: web
    name: noorwallart-admin-static
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
